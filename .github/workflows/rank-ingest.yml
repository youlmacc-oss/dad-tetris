name: Ingest shared ranking

on:
  repository_dispatch:
    types: [dad-rank]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON row or {records:[...]}
        required: false
        type: string

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge ranking payload
        env:
          RANK_PAYLOAD: ${{ github.event.inputs.payload || '' }}
        run: node scripts/merge-leaderboard.js
      - name: Commit leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git diff --cached --quiet && echo "No ranking changes" && exit 0
          git commit -m "chore: sync shared ranking board"
          git push
