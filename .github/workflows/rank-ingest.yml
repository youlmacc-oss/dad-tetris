name: Ingest shared ranking

on:
  repository_dispatch:
    types: [dad-rank]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON row or {records:[...]}
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.title, '[dad-rank]') || contains(join(github.event.issue.labels.*.name, ','), 'dad-rank') }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge ranking payload
        env:
          RANK_PAYLOAD: ${{ github.event.inputs.payload || '' }}
        run: node scripts/merge-leaderboard.js
      - name: Commit leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git diff --cached --quiet && echo "No ranking changes" && exit 0
          git commit -m "chore: sync shared ranking board"
          git push
      - name: Close ingest issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Merged into the shared ranking board."
